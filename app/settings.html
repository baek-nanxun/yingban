<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:"><title>映伴设置</title><link rel="stylesheet" href="styles.css"></head>
<body class="settings-window"><div class="settings-shell">
  <nav class="settings-nav" aria-label="设置分类"><h1>设置</h1><button class="settings-tab active" data-tab="audio" aria-selected="true"><svg class="icon"><use href="icons.svg#mic"/></svg>声音</button><button class="settings-tab" data-tab="sharing" aria-selected="false"><svg class="icon"><use href="icons.svg#monitor"/></svg>共享</button><button class="settings-tab" data-tab="about" aria-selected="false"><svg class="icon"><use href="icons.svg#refresh-cw"/></svg>关于与更新</button><span class="settings-version" id="versionLabel">YingBan</span></nav>
  <main class="settings-content">
    <section data-panel="audio"><h2>声音</h2><p class="settings-subtitle">选择输入设备，调整通话和共享声音。</p>
      <div class="settings-field"><label for="micDevice">麦克风</label><select id="micDevice"><option value="">系统默认</option></select><p class="settings-help" id="deviceHint"></p></div>
      <div class="settings-field"><label for="inputMode">麦克风处理</label><select id="inputMode"><option value="standard">自动 · 回声消除、降噪与音量调整</option><option value="compatibility">兼容 · 保留回声消除，关闭降噪与自动增益</option></select><p class="settings-help">出现设备卡顿时可尝试兼容模式，或切换有线 / USB 麦克风。</p></div>
      <div class="meter-line"><span>我</span><div class="meter"><div id="localMeter"></div></div><span id="localVoice">未开启</span></div><div class="meter-line"><span>对方</span><div class="meter"><div id="remoteMeter"></div></div><span id="remoteVoice">未连接</span></div>
      <section class="settings-section"><h3>共享声音</h3><div class="settings-row"><label for="sharedVolume">收听音量</label><output id="volumeLabel">80%</output></div><input id="sharedVolume" type="range" min="0" max="100" value="80"><p class="settings-help">只调整自己听到的共享声音。</p></section>
    </section>
    <section data-panel="sharing" hidden><h2>共享</h2><p class="settings-subtitle">共享端统一调节背景音，让说话更清楚。</p>
      <div class="settings-row"><label for="duckEnabled">人声优先</label><label class="toggle"><input id="duckEnabled" type="checkbox" checked aria-label="启用人声优先"><span></span></label></div><p class="settings-help" id="duckDescription">任意一方说话时降低共享内容的声音。</p>
      <div class="settings-field"><div class="settings-row"><label for="duckDepth">降低强度</label><output id="depthLabel">15 dB</output></div><input id="duckDepth" type="range" min="6" max="24" value="15"></div>
      <div class="settings-field"><div class="settings-row"><label for="sensitivity">人声检测灵敏度</label><output id="sensitivityLabel">适中</output></div><input id="sensitivity" type="range" min="25" max="60" value="42"><p class="settings-help">轻声说话时可提高灵敏度；环境噪声触发时可降低。</p></div>
      <section class="settings-section"><h3>共享范围</h3><p class="settings-help">应用窗口只共享所属应用的声音；整屏共享包含其他应用声音，并排除映伴通话。同一浏览器的多个标签页可能共用音频进程。</p><p class="settings-status" id="duckStatus"></p></section>
    </section>
    <section data-panel="about" hidden><img class="brand-mark about-mark" src="brand.svg" alt=""><h2>映伴 YingBan</h2><p class="settings-subtitle" id="aboutVersion"></p><p class="settings-help">一起看屏幕，清楚地交流。</p><div class="about-buttons"><button id="checkUpdate" class="button secondary-button"><svg class="icon"><use href="icons.svg#refresh-cw"/></svg>检查更新</button><button id="downloadUpdate" class="button primary-button" hidden>前往下载</button></div><p id="updateStatus" class="settings-status" role="status"></p></section>
    <p class="settings-save-note" id="saveStatus" role="status">设置自动保存</p>
  </main>
</div><script src="settings.js"></script></body></html>
