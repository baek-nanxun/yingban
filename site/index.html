<main><section class="hero"><div><div class="eyebrow">WINDOWS 屏幕共享与语音通话</div><h1>一起看屏幕，清楚地交流。</h1><p>映伴让两台 Windows 电脑通过局域网或 Tailscale 连接。共享整个屏幕或单个应用，应用声音按选择发送，人声优先保持清晰。</p><div class="actions"><a class="button primary" href="https://github.com/baek-nanxun/yingban/releases/download/v1.0.7/YingBan-Setup-1.0.7.exe">下载 Windows 安装包</a><a class="button secondary" href="#features">了解映伴</a></div></div><div class="mock"><div class="mock-top"><i class="dot"></i><i class="dot"></i><i class="dot"></i></div><div class="screen"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="14" rx="2"/><path d="M8 21h8M12 18v3"/></svg></div></div></section><section class="features" id="features"><article class="feature"><svg class="feature-icon" viewBox="0 0 24 24"><path d="M3 5h18v14H3z"/><path d="M8 21h8M12 19v2"/></svg><h2>应用级声音</h2><p>共享单个应用时，只发送这个应用的声音；整屏共享时再包含其他应用声音。</p></article><article class="feature"><svg class="feature-icon" viewBox="0 0 24 24"><path d="M12 3v18M3 12h18"/><circle cx="12" cy="12" r="9"/></svg><h2>人声优先</h2><p>任意一方说话时，共享端降低背景音，让双方都能听清楚。</p></article><article class="feature"><svg class="feature-icon" viewBox="0 0 24 24"><path d="M4 5h16v14H4z"/><path d="M13 13h5v4h-5z"/></svg><h2>4K 与浮窗</h2><p>支持 4K 共享，观看端可以全屏或打开可调整大小的浮窗观看。</p></article></section></main></body></html>
