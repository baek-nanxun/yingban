name: Build YingBan Windows

on:
  push:
    branches: [main, master, 'Nanswin/**']
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run unit tests
        run: npm test
      - name: Build portable application
        run: npm run dist
      - name: Build Windows installer
        run: npm run dist:installer
      - name: Archive Windows package
        shell: pwsh
        env:
          YINGBAN_OUTPUT_DIR: ${{ github.workspace }}\release
        run: python scripts/archive.py
      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: yingban-windows
          retention-days: 30
          path: |
            release/*
            dist/*.exe
          if-no-files-found: error
      - name: Upload Windows installer separately
        uses: actions/upload-artifact@v4
        with:
          name: yingban-windows-installer
          retention-days: 30
          path: dist/YingBan-Setup-*.exe
          if-no-files-found: error
