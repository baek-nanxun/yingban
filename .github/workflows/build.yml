name: Build YingBan

on:
  push:
    branches: [main, master, 'Nanswin/**']
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run unit tests
        run: npm test
      - name: Build portable application
        run: npm run dist
      - name: Build Windows installer
        run: npm run dist:installer
      - name: Archive Windows package
        shell: pwsh
        env:
          YINGBAN_OUTPUT_DIR: ${{ github.workspace }}\release
        run: python scripts/archive.py
      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: yingban-windows
          path: |
            release/*
            dist/*.exe

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build Linux packages
        run: npm run dist:linux
      - uses: actions/upload-artifact@v4
        with:
          name: yingban-linux-x64-preview
          path: |
            dist-linux/*.AppImage
            dist-linux/*.deb
      - name: Install virtual desktop window manager
        run: sudo apt-get update && sudo apt-get install -y openbox
      - name: Verify Linux desktop and screen sharing
        run: xvfb-run -a -s '-screen 0 1280x800x24' sh -c 'openbox >/tmp/yingban-openbox.log 2>&1 & exec npm run test:linux'

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install Android build tools
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1
      - name: Build Android test package
        run: gradle -p android :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: yingban-android-debug
          path: android/app/build/outputs/apk/debug/*.apk
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install virtual desktop window manager
        run: sudo apt-get update && sudo apt-get install -y openbox
      - name: Verify Android and desktop interoperability
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          script: adb install android/app/build/outputs/apk/debug/app-debug.apk && xvfb-run -a -s '-screen 0 1280x800x24' sh -c 'openbox >/tmp/yingban-openbox.log 2>&1 & exec node tests/android-desktop.cjs'
