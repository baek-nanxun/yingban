name: Release YingBan Linux

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-linux:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build Linux packages
        run: npm run dist:linux
      - name: Install virtual desktop and audio test dependencies
        run: sudo apt-get update && sudo apt-get install -y openbox pipewire pipewire-pulse wireplumber pulseaudio-utils dbus-x11
      - name: Verify isolated audio capture and ducking
        run: bash scripts/test-linux-audio.sh
      - name: Verify Linux desktop and screen sharing
        run: xvfb-run -a -s '-screen 0 1280x800x24' sh -c 'openbox >/tmp/yingban-openbox.log 2>&1 & exec npm run test:linux'
      - name: Publish Linux packages
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist-linux/*.deb
            dist-linux/*.AppImage
